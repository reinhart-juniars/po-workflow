<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Diagram alur panduan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap">
<!--
  Sumber diagram alur untuk panduan PDF. Setiap <svg id="alur-..."> dirender menjadi
  docs/panduan/img/<id>.jpg oleh: node scripts/docs/render-diagrams.mjs
  Lebar viewBox 600 = lebar isi halaman A4, jadi 11px di sini kira-kira 8,5pt di kertas.
-->
<style>
  body { margin: 24px; background: #fff; font-family: "Public Sans", "Segoe UI", Arial, sans-serif; }
  svg.alur { display: block; margin: 0 0 48px; overflow: visible; font-family: "Public Sans", "Segoe UI", Arial, sans-serif; }
  .alur text { fill: #0f172a; font-size: 11px; }
  .alur .t { font-size: 12px; font-weight: 700; }
  .alur .t.big { font-size: 17px; font-weight: 800; }
  .alur .s { font-size: 11px; fill: #526077; }
  .alur .lab { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; fill: #526077; }
  .alur .lab.br { fill: #3455db; }
  .alur .yes { fill: #157a3c; font-weight: 700; }
  .alur .no { fill: #b42323; font-weight: 700; }
  .alur .bad-t { fill: #b42323; }
  .alur .act { fill: #2740a4; font-weight: 700; }
  .alur .on { fill: #ffffff; }
  .alur .bx { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; }
  .alur .bx.br { fill: #eef1fd; stroke: #3455db; }
  .alur .bx.solid { fill: #3455db; stroke: #3455db; }
  .alur .bx.ok { fill: #e8f6ee; stroke: #157a3c; }
  .alur .bx.okw { fill: #ffffff; stroke: #157a3c; }
  .alur .bx.wa { fill: #fff4e0; stroke: #a35a00; }
  .alur .bx.bad { fill: #fdecec; stroke: #b42323; }
  .alur .band { fill: #f4f6fa; }
  .alur .band.ok { fill: #e8f6ee; }
  .alur .sep { stroke: #e2e8f0; stroke-width: 1; fill: none; }
  .alur .ln { fill: none; stroke: #64748b; stroke-width: 1.6; marker-end: url(#ah); }
  .alur .ln.br { stroke: #3455db; marker-end: url(#ah-br); }
  .alur .ln.ok { stroke: #157a3c; marker-end: url(#ah-ok); }
  .alur .ln.bad { stroke: #b42323; marker-end: url(#ah-bad); }
  .alur .ln.dash { stroke-dasharray: 5 4; }
  .alur .ln.nm { marker-end: none; }
  .alur .num { fill: #3455db; }
  .alur .numt { fill: #ffffff; font-size: 10px; font-weight: 800; }
</style>
</head>
<body>

<svg width="0" height="0" style="position: absolute;" aria-hidden="true">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="ah-br" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3455db"/></marker>
    <marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#157a3c"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42323"/></marker>

</svg>
